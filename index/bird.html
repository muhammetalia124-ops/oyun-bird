<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Flappy Bird</title>
    <style>
        /* DOM Sıfırlama ve Tam Ekran Optimizasyonları */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #020617; /* Slate 950 - Koyu zemin */
            overflow: hidden;
            /* Mobil cihazlarda zoom ve kaydırmayı donanım seviyesinde engelle */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px; /* Tablet/Desktop için dikey yönelim kısıtlaması */
            max-height: 850px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            background: linear-gradient(to bottom, #1e1b4b 0%, #0f172a 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Kullanıcı Arayüzü (UI) HUD Katmanı */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Tıklamalar doğrudan Canvas'a geçmeli */
            z-index: 10;
        }

        .score-display {
            text-align: center;
            padding-top: 15vh;
        }

        #live-score {
            font-size: 5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.8), 0 0 5px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        /* Menü Arayüzleri (Overlay) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(6px); /* Arka planı hafifçe flulaştırır */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #22d3ee, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(192, 132, 252, 0.4);
            letter-spacing: -2px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .action-btn {
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-btn:active {
            transform: translateY(2px) scale(0.95);
            box-shadow: 0 5px 10px -5px rgba(99, 102, 241, 0.5);
        }

        .score-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem 3rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .score-card p { 
            font-size: 1.2rem; 
            color: #cbd5e1; 
            margin: 0.5rem 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .score-card span { 
            font-size: 2rem;
            font-weight: 900;
            color: #c084fc; 
            display: block;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud-layer">
        <div class="score-display">
            <div id="live-score" class="hidden">0</div>
        </div>
    </div>

    <!-- Başlangıç Ekranı -->
    <div id="screen-start" class="overlay">
        <h1>NEON BIRD</h1>
        <p class="subtitle">Ekrana dokun, yerçekimine meydan oku.</p>
        <button class="action-btn" id="btn-start">BAŞLA</button>
    </div>

    <!-- Oyun Sonu Ekranı -->
    <div id="screen-gameover" class="overlay hidden">
        <h1>ÇARPIŞMA!</h1>
        <div class="score-card">
            <p>Skor <span><output id="stat-score">0</output></span></p>
            <p>En İyi <span><output id="stat-best">0</output></span></p>
        </div>
        <button class="action-btn" id="btn-restart">TEKRAR OYNA</button>
    </div>
</div>

<script>
/**
 * ==========================================
 * PROSEDÜREL SES MOTORU (WEB AUDIO API)
 * ==========================================
 * Herhangi bir MP3/WAV dosyasına ihtiyaç duymadan
 * sentezleyiciler (oscillator) kullanılarak retro sesler üretilir.
 */
class AudioSynth {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    // Kullanıcı etkileşimi ile AudioContext başlatılmalıdır (Autoplay kuralları)
    init() {
        if (!this.initialized) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.initialized = true;
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    // Zıplama (Flap): Yumuşak sinüs dalgası, hızlı frekans düşüşü
    playFlap() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    // Skor (Point): İki aşamalı kare dalga (Ding-ding hissi)
    playScore() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime + 0.05);
        
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    // Çarpışma (Hit): Düşük frekanslı testere dalgası, distorsiyonlu etki
    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.25);
        
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
    }
}
const audio = new AudioSynth();

/**
 * ==========================================
 * OYUN MİMARİSİ VE FİZİK MOTORU
 * ==========================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const screenStart = document.getElementById('screen-start');
const screenGameOver = document.getElementById('screen-gameover');
const uiLiveScore = document.getElementById('live-score');
const statScore = document.getElementById('stat-score');
const statBest = document.getElementById('stat-best');

let canvasW, canvasH;

// Cihaz piksel oranına (DPR) göre Canvas çözünürlüğünün kalibre edilmesi
function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    canvasW = rect.width;
    canvasH = rect.height;
    
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ================= SINIFLAR =================

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        // Rastgele fırlama hızları
        this.vx = (Math.random() - 0.5) * 800; 
        this.vy = (Math.random() - 0.5) * 800; 
        this.alpha = 1.0; 
        this.decay = Math.random() * 0.015 + 0.01;
        this.color = color;
        this.radius = Math.random() * 5 + 2;
    }
    
    update(dt) {
        this.vy += 900 * dt; // Yerçekimi parçacıkları da aşağı çeker
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.alpha -= this.decay;
    }
    
    draw(ctx) {
        if(this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
    }
}

class Bird {
    constructor() {
        this.radius = Math.min(canvasW, canvasH) * 0.04;
        this.x = canvasW * 0.3;
        this.y = canvasH * 0.5;
        this.velocity = 0;
        
        // Dinamik Ekran Orantılı Fizik
        this.gravity = canvasH * 3.5; 
        this.jumpImpulse = canvasH * -1.0; 
        this.color = '#22d3ee';
        
        this.trail = [];
    }

    flap() {
        this.velocity = this.jumpImpulse;
        audio.playFlap();
    }

    update(dt) {
        // Euler Entegrasyonu
        this.velocity += this.gravity * dt;
        this.y += this.velocity * dt;
        
        // Hareket izi kuyruğunu yönet
        this.trail.unshift({x: this.x, y: this.y});
        if(this.trail.length > 8) this.trail.pop();
    }

    draw(ctx) {
        // 1. Hareket İzi Çizimi (Glow optimizasyonu: Gradyan kullanımı)
        if (this.trail.length > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            ctx.lineWidth = this.radius * 1.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const gradient = ctx.createLinearGradient(this.x, this.y, this.x - (canvasW*0.2), this.y);
            gradient.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
            gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');
            
            ctx.strokeStyle = gradient;
            ctx.stroke();
            ctx.restore();
        }

        // 2. Ana Dairesel Gövde
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Hıza bağlı rotasyon matematiği
        let rotation = Math.min(Math.PI / 3, Math.max(-Math.PI / 4, (this.velocity * 0.0012)));
        ctx.rotate(rotation);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        
        // Gövde içi parlama (Highlights)
        ctx.beginPath();
        ctx.arc(-this.radius * 0.25, -this.radius * 0.25, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
        
        ctx.restore();
    }
}

class Pipe {
    constructor() {
        this.gap = canvasH * 0.26; // Geçiş boşluğu (ekrana orantılı)
        this.topHeight = Math.random() * (canvasH * 0.45) + (canvasH * 0.1);
        this.bottomY = this.topHeight + this.gap;
        
        this.width = canvasW * 0.18;
        this.x = canvasW;
        this.speed = canvasW * 0.5; // Saniyede ekranın %50'si kadar ilerler
        this.passed = false;
    }

    update(dt) {
        this.x -= this.speed * dt;
    }

    draw(ctx) {
        // shadowBlur kullanmak yerine performans dostu Linear Gradient
        const pipeGradient = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        pipeGradient.addColorStop(0, '#4c1d95'); 
        pipeGradient.addColorStop(0.5, '#c084fc'); 
        pipeGradient.addColorStop(1, '#4c1d95');

        ctx.fillStyle = pipeGradient;
        
        // Üst Kütle
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        // Alt Kütle
        ctx.fillRect(this.x, this.bottomY, this.width, canvasH - this.bottomY);
        
        // Neon Hatlar (Caps)
        ctx.strokeStyle = '#f472b6'; // Pembe sınır çizgisi
        ctx.lineWidth = 4;
        
        ctx.strokeRect(this.x - 2, this.topHeight - 12, this.width + 4, 12);
        ctx.strokeRect(this.x - 2, this.bottomY, this.width + 4, 12);
    }
}

// ================= OYUN DEĞİŞKENLERİ =================
let bird;
let pipes = [];
let particles = [];
let score = 0;
let bestScore = 0;
let gameState = 'START'; // Durumlar: START, PLAYING, GAMEOVER
let lastTime = 0;
let animationId;

// Depolama Kotası ve Gizli Mod hatalarına karşı korumalı LocalStorage okuması
try {
    const saved = localStorage.getItem('modernFlappyBest');
    if (saved) bestScore = parseInt(saved, 10);
} catch (error) {
    console.warn("Storage erişimi engellendi (Gizli Mod). Veri uçucu olacaktır.");
}

function startGame() {
    audio.init();
    bird = new Bird();
    pipes = [];
    particles = [];
    score = 0;
    
    uiLiveScore.textContent = score;
    gameState = 'PLAYING';
    
    screenStart.classList.add('hidden');
    screenGameOver.classList.add('hidden');
    uiLiveScore.classList.remove('hidden');
    
    lastTime = performance.now();
    cancelAnimationFrame(animationId);
    gameLoop(lastTime);
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    audio.playHit();
    
    // Parçalanma efektini oluştur
    for(let i=0; i<40; i++) {
        particles.push(new Particle(bird.x, bird.y, bird.color));
        particles.push(new Particle(bird.x, bird.y, '#ffffff'));
    }
    
    uiLiveScore.classList.add('hidden');
    
    // Yeni rekor kontrolü ve güvenli kayıt
    if (score > bestScore) {
        bestScore = score;
        try {
            localStorage.setItem('modernFlappyBest', bestScore.toString());
        } catch(error) {
            // Hata sessizce yutulur, oyun çökmekten kurtarılır
        }
    }
    
    statScore.textContent = score;
    statBest.textContent = bestScore;
    
    // Göz yanılmasını engellemek için menü gecikmeli getirilir
    setTimeout(() => {
        screenGameOver.classList.remove('hidden');
    }, 600);
}

// SAT (Separating Axis Theorem) tabanlı Daire & AABB (Dikdörtgen) Çarpışma Tespiti
function checkCollisions() {
    // 1. Zemin ve Tavan Kontrolü
    if (bird.y + bird.radius >= canvasH || bird.y - bird.radius <= 0) {
        triggerGameOver();
        return;
    }

    // 2. Borulara Karşı Voronoi En Yakın Nokta Kontrolü
    for (let pipe of pipes) {
        
        // --- Üst Boru Kontrolü ---
        // Dikdörtgenin kuş merkezine X ve Y düzlemindeki en yakın noktasını (Closest Point) bul
        let closestX_Top = Math.max(pipe.x, Math.min(bird.x, pipe.x + pipe.width));
        let closestY_Top = Math.max(0, Math.min(bird.y, pipe.topHeight));
        
        // Bu en yakın noktanın kuşun merkezine uzaklığını ölç
        let dx_Top = bird.x - closestX_Top;
        let dy_Top = bird.y - closestY_Top;
        
        // Pisagor teoremi: Uzaklık yarıçaptan küçükse kesin kesişim vardır
        if ((dx_Top * dx_Top + dy_Top * dy_Top) < (bird.radius * bird.radius)) {
            triggerGameOver();
            return;
        }

        // --- Alt Boru Kontrolü ---
        let closestX_Bottom = Math.max(pipe.x, Math.min(bird.x, pipe.x + pipe.width));
        let closestY_Bottom = Math.max(pipe.bottomY, Math.min(bird.y, canvasH));
        
        let dx_Bottom = bird.x - closestX_Bottom;
        let dy_Bottom = bird.y - closestY_Bottom;
        
        if ((dx_Bottom * dx_Bottom + dy_Bottom * dy_Bottom) < (bird.radius * bird.radius)) {
            triggerGameOver();
            return;
        }
    }
}

// ================= RENDER DÖNGÜSÜ =================
function gameLoop(timestamp) {
    // Delta Time Hesaplanması ve Sınırlandırılması (Clamping)
    let dt = (timestamp - lastTime) / 1000;
    // Eğer sekme arka plana alınmışsa dt devasa olur. Fizik patlamasın diye 0.1 saniye (100ms) limiti:
    if (dt > 0.1) dt = 0.1; 
    lastTime = timestamp;

    // Her karede Canvas'ı temizle
    ctx.clearRect(0, 0, canvasW, canvasH);

    if (gameState === 'PLAYING') {
        // Yeni boru nesnesi üretme şartı
        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvasW - (canvasW * 0.55)) {
            pipes.push(new Pipe());
        }

        // Boru güncellemeleri
        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.update(dt);
            p.draw(ctx);

            // Başarılı geçiş sonrası skor artırımı
            if (!p.passed && bird.x > p.x + p.width) {
                score++;
                uiLiveScore.textContent = score;
                uiLiveScore.style.transform = 'scale(1.3)'; // Pop efekti
                setTimeout(() => uiLiveScore.style.transform = 'scale(1)', 100);
                p.passed = true;
                audio.playScore();
            }

            // Ekrandan çıkan nesnenin çöp toplayıcıya (Garbage Collector) devredilmesi
            if (p.x + p.width < 0) {
                pipes.splice(i, 1);
            }
        }

        bird.update(dt);
        bird.draw(ctx);
        checkCollisions();
    }
    
    // Oyun bitse bile partiküllerin düşmeye devam etmesi
    if (particles.length > 0) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.update(dt);
            pt.draw(ctx);
            if (pt.alpha <= 0) particles.splice(i, 1);
        }
    }

    // Oyun bittiyse ve partiküller temizlendiyse döngüyü askıya al (CPU tasarrufu)
    if (gameState === 'GAMEOVER' && particles.length === 0) return;

    animationId = requestAnimationFrame(gameLoop);
}

// ================= GİRDİ (INPUT) YÖNETİMİ =================
function handleInteraction(e) {
    // Mobil Safari'de dokunmanın ekranı kaydırmasını (scroll/pan) kesin olarak engelle
    if (e.type !== 'keydown') e.preventDefault(); 
    
    // Sadece Boşluk tuşu, Fare Sol Tık veya Ekrana Dokunma kabul edilir
    if (e.type === 'keydown' && e.code !== 'Space') return;
    
    // Girdi alındığı an Ses motorunu güvenle uyar (Autoplay Policy aşımı)
    audio.init(); 

    if (gameState === 'START' || gameState === 'GAMEOVER') {
        // Gameover ekranı fade-in olurken aniden restart atılmasını engelle
        if (gameState === 'GAMEOVER' && screenGameOver.classList.contains('hidden')) return;
        startGame();
    } else if (gameState === 'PLAYING') {
        bird.flap();
